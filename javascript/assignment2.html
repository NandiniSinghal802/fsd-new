<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Booking System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e5ddf7;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 550px;
            margin: auto;
            padding: 35px;
            border: 2px solid black;
            background-color: #fffafa;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        h2 {
            text-align: center;
            margin: 25px 0;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin: 16px 0;
        }

        .form-group label {
            width: 170px;
            font-size: 18px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 260px;
            height: 36px;
            padding: 5px 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .radio-group {
            margin: 15px 0;
            font-size: 18px;
        }

        .radio-group input {
            margin-right: 8px;
        }

        .button {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 35px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Bus Booking System</h1>

        <h2>User Information</h2>

        <div class="form-group">
            <label>User Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>User Age:</label>
            <input type="number" id="age" placeholder="Enter your age">
        </div>

        <div class="form-group">
            <label>User Address:</label>
            <input type="text" id="address" placeholder="Enter your address">
        </div>

        <div class="form-group">
            <label>Select Your City:</label>

            <select id="city">
                <option value="">Select City</option>
                <option>Delhi</option>
                <option>Noida</option>
                <option>Ghaziabad</option>
                <option>Lucknow</option>
                <option>Kanpur</option>
            </select>
        </div>

        <div class="form-group">
            <label>Journey Date:</label>
            <input type="date" id="date">
        </div>


        <h2>Bus Information</h2>

        <div class="radio-group">
            <input type="radio" name="bus" value="800">
            AC Bus - ₹800
        </div>

        <div class="radio-group">
            <input type="radio" name="bus" value="500">
            Non AC Bus - ₹500
        </div>


        <div class="form-group">
            <label>Select Your Seat:</label>

            <select id="seat">
                <option value="">Select Seat</option>
                <option>Seat 1</option>
                <option>Seat 2</option>
                <option>Seat 3</option>
                <option>Seat 4</option>
                <option>Seat 5</option>
            </select>
        </div>


        <div class="button">
            <button type="button" onclick="bookTicket()">
                Buy Now
            </button>
        </div>

    </div>


    <script>

        function bookTicket() {

            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let address = document.getElementById("address").value;
            let city = document.getElementById("city").value;
            let date = document.getElementById("date").value;
            let seat = document.getElementById("seat").value;

            let bus = document.querySelector(
                'input[name="bus"]:checked'
            );

            if (name === "" || age === "" || address === "" ||
                city === "" || date === "" || seat === "" || bus === null) {

                alert("Please fill all the details!");
                return;
            }

            alert(
                "🎉 Ticket Booked Successfully!\n\n" +
                "Name: " + name + "\n" +
                "Age: " + age + "\n" +
                "City: " + city + "\n" +
                "Journey Date: " + date + "\n" +
                "Bus Fare: ₹" + bus.value + "\n" +
                "Seat: " + seat
            );
        }

    </script>

</body>
</html>
